<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Wall Street Arena</title>

  <style>
    :root {
      --gold: #d9b477;
      --gold-light: #f0d09d;
      --cream: #f6e5c7;
      --bg: #070b0e;
      --panel: rgba(8, 12, 16, 0.82);
      --line: rgba(218, 181, 125, 0.42);
      --muted: #85898e;
      --text: #f4eee5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 61% 39%;
      background: #070b0e;
    }

    /* LEFT SIDE — cropped from the supplied reference image */
    .visual {
      position: relative;
      min-height: 100vh;
      background-image: url("wall-street-arena-hero.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,0.02) 55%, rgba(5,8,11,0.28) 100%),
        linear-gradient(0deg, rgba(3,5,7,0.32), transparent 38%);
      pointer-events: none;
    }

    /* RIGHT SIDE */
    .login-side {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 7vw 48px 5vw;
      background:
        radial-gradient(circle at 50% 20%, rgba(217,180,119,0.055), transparent 32%),
        linear-gradient(135deg, #0a0f13 0%, #06090c 100%);
      border-left: 1px solid rgba(255,255,255,0.035);
    }

    .login-card {
      width: min(470px, 100%);
      transform: translateY(-2px);
    }

    .brand {
      text-align: center;
      margin-bottom: 42px;
    }

    .brand-icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      color: var(--gold);
    }

    .brand-icon svg {
      width: 57px;
      height: 57px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      color: var(--cream);
      font-size: clamp(17px, 1.35vw, 25px);
      letter-spacing: 0.34em;
      margin-left: 0.34em;
      line-height: 1;
      margin-bottom: 10px;
    }

    h1 {
      color: #f0e2ca;
      font-size: clamp(35px, 3vw, 57px);
      font-weight: 500;
      letter-spacing: 0.075em;
      line-height: 0.95;
      white-space: nowrap;
    }

    .arena {
      color: var(--gold-light);
      font-size: clamp(24px, 2vw, 37px);
      letter-spacing: 0.34em;
      margin-left: 0.34em;
      margin-top: 12px;
      font-weight: 400;
    }

    .divider {
      width: 58%;
      height: 1px;
      margin: 26px auto 18px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(217,180,119,0.75),
        transparent
      );
    }

    .tagline {
      color: #d3b888;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.34em;
      margin-left: 0.34em;
    }

    form {
      margin-top: 56px;
    }

    .field {
      position: relative;
      margin-bottom: 24px;
    }

    .field-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translateY(-50%);
      color: #d5bd97;
      opacity: 0.92;
      pointer-events: none;
    }

    .field-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    input {
      width: 100%;
      height: 61px;
      border: 1px solid rgba(219,188,142,0.43);
      border-radius: 14px;
      outline: none;
      background: rgba(3, 7, 10, 0.54);
      color: #f5eee4;
      font-family: Arial, sans-serif;
      font-size: 16px;
      padding: 0 22px 0 61px;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.015),
        0 8px 30px rgba(0,0,0,0.13);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input::placeholder {
      color: #777d84;
      opacity: 1;
    }

    input:focus {
      border-color: rgba(240,208,157,0.82);
      background: rgba(4,8,11,0.78);
      box-shadow:
        0 0 0 3px rgba(217,180,119,0.07),
        0 12px 35px rgba(0,0,0,0.2);
    }

    .login-btn {
      width: 100%;
      height: 62px;
      margin-top: 2px;
      border: 1px solid rgba(255,231,190,0.45);
      border-radius: 14px;
      cursor: pointer;
      color: #111315;
      background: linear-gradient(180deg, #ead0a4 0%, #c99e66 100%);
      font-family: Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.22em;
      transition:
        transform .18s ease,
        filter .18s ease,
        box-shadow .18s ease;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }

    .login-btn span {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      transform: translateX(7px);
    }

    .arrow {
      font-size: 25px;
      line-height: 0;
      font-weight: 400;
    }

    .login-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
      box-shadow: 0 15px 38px rgba(0,0,0,0.34);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error {
      min-height: 20px;
      margin: 15px 4px 0;
      color: #d9a18e;
      font: 12px/1.4 Arial, sans-serif;
      text-align: center;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .error.show {
      opacity: 1;
    }

    .copyright {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,0.27);
      font: 10px Arial, sans-serif;
      letter-spacing: 0.15em;
    }

    @media (max-width: 900px) {
      html, body {
        overflow: auto;
      }

      .page {
        grid-template-columns: 1fr;
        min-height: 100vh;
      }

      .visual {
        min-height: 43vh;
      }

      .login-side {
        min-height: 57vh;
        padding: 42px 8vw 60px;
      }

      .brand {
        margin-bottom: 30px;
      }

      form {
        margin-top: 35px;
      }

      .copyright {
        position: static;
        margin-top: 28px;
      }
    }

    @media (max-width: 480px) {
      .visual {
        min-height: 34vh;
      }

      .login-side {
        padding: 36px 22px 50px;
      }

      h1 {
        font-size: 31px;
      }

      .arena {
        font-size: 22px;
      }

      .tagline {
        font-size: 10px;
      }

      input,
      .login-btn {
        height: 57px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="visual" aria-label="Wall Street Arena visual"></section>

    <section class="login-side">
      <div class="login-card">

        <header class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M7 53h50" />
              <path d="M13 48V36" />
              <path d="M27 48V29" />
              <path d="M41 48V21" />
              <path d="M55 48V12" />
              <path d="M10 34l15-11 9 5 17-18" />
              <path d="M44 10h8v8" />
            </svg>
          </div>

          <div class="eyebrow">THE</div>
          <h1>WALL STREET</h1>
          <div class="arena">ARENA</div>

          <div class="divider"></div>

          <div class="tagline">TRADE &nbsp;/&nbsp; ANALYZE &nbsp;/&nbsp; GROW</div>
        </header>

        <form id="loginForm" autocomplete="off">
          <div class="field">
            <div class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.2"></circle>
                <path d="M5.3 19c.7-3.1 3.1-5 6.7-5s6 1.9 6.7 5"></path>
              </svg>
            </div>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Username"
              required
              autofocus
            />
          </div>

          <div class="field">
            <div class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <rect x="5.5" y="10" width="13" height="10" rx="1.8"></rect>
                <path d="M8 10V7.4a4 4 0 0 1 8 0V10"></path>
                <circle cx="12" cy="15" r="1"></circle>
                <path d="M12 16v1.5"></path>
              </svg>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Password"
              required
            />
          </div>

          <button class="login-btn" type="submit">
            <span>LOGIN <b class="arrow">→</b></span>
          </button>

          <div id="error" class="error" role="alert"></div>
        </form>
      </div>

      <div class="copyright">MARKET SIMULATION • FICTIONAL MARKET</div>
    </section>

  </main>

  <script>
    /*
      Frontend-only login hook.
      Replace this function with your backend API call later.

      Example:
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ username, password })
        });
    */
    const form = document.getElementById("loginForm");
    const error = document.getElementById("error");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      error.classList.remove("show");
      error.textContent = "";

      if (!username || !password) {
        error.textContent = "Please enter your username and password.";
        error.classList.add("show");
        return;
      }

      // Temporary demo behaviour.
      // Connect your real authentication API here.
      console.log("Login attempt:", { username });

      error.textContent = "Connect this form to your login API.";
      error.classList.add("show");
    });
  </script>
</body>
</html>
